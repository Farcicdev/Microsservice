spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ms_email_ms
    username: postgres
    password: postgre
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
