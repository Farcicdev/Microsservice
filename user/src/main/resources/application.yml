spring:
  application:
    name: user

  datasource:
    url: jdbc:postgresql://localhost:5432/ms-user-ms
    username: postgres
    password: postgre
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  rabbitmq:
    addresses: ${ADDRES}

  flyway:
    enabled: true
    locations: classpath:db.migration
    baseline-on-migrate: true

server:
  port: 8081